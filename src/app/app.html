<main class="flex min-h-dvh items-center justify-center p-6">
  <section app-card class="w-full max-w-md lg:max-w-lg">
    <header app-card-header>
      <h1 app-card-title>ChefMate</h1>
      <p app-card-description>UI kit scaffold — semantic tokens, themable later.</p>
    </header>
    <div app-card-content class="flex flex-col gap-4">
      <input app-input type="search" placeholder="Search recipes…" aria-label="Search recipes" />
      <div class="flex flex-wrap gap-2">
        <span app-badge>new</span>
        <span app-badge variant="muted">draft</span>
        <span app-badge variant="outline">vegetarian</span>
        <span app-badge variant="destructive">expiring</span>
      </div>
    </div>
    <footer app-card-footer class="flex-wrap md:justify-end">
      <button app-button>Primary</button>
      <button app-button variant="outline">Outline</button>
      <button app-button variant="ghost">Ghost</button>
      <button app-button variant="destructive">Delete</button>
    </footer>
  </section>
</main>

<router-outlet />
